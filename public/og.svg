<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Subtle radial glow from top-left -->
    <radialGradient id="glow" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#FF5130" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#111110" stop-opacity="0"/>
    </radialGradient>
    <!-- Clip for the right-side circle decoration -->
    <clipPath id="rightClip">
      <rect x="700" y="0" width="500" height="630"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#111110"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Right-side decorative ring + checkmark (clipped to right half) -->
  <g clip-path="url(#rightClip)" opacity="0.18">
    <circle cx="1020" cy="315" r="260" fill="none" stroke="#FF5130" stroke-width="1.5"/>
    <circle cx="1020" cy="315" r="195" fill="none" stroke="#FF5130" stroke-width="1"/>
    <circle cx="1020" cy="315" r="130" fill="#FF5130" opacity="0.4"/>
    <path d="M940 315 l55 55 l95-95" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Top-left logo mark -->
  <circle cx="80" cy="70" r="26" fill="#FF5130"/>
  <path d="M69.5 70.5l7.5 7.5 13.5-13.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="116" y="78"
    font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="22" font-weight="600" fill="white">
    KitCheck
  </text>

  <!-- Main headline -->
  <text x="80" y="298"
    font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="82" font-weight="700" letter-spacing="-2" fill="white">
    Know exactly
  </text>
  <text x="80" y="392"
    font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="82" font-weight="700" letter-spacing="-2" fill="white">
    what to wear.
  </text>

  <!-- Descriptor line -->
  <text x="80" y="454"
    font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="26" font-weight="400" fill="#9E9D9A">
    Free cycling kit calculator · Head to feet · In seconds.
  </text>

  <!-- Bottom: coral accent + URL -->
  <rect x="80" y="548" width="44" height="3" rx="1.5" fill="#FF5130"/>
  <text x="80" y="588"
    font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="20" font-weight="500" fill="#6B6A67">
    kitcheck.cc
  </text>
</svg>
